name: Build and Push Backend Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ./backend

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v
        working-directory: ./backend

  build-and-push:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read          # Required for SARIF upload in private repos
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Convert repository name to lowercase
        id: repo_lowercase
        run: |
          echo "value=${GITHUB_REPOSITORY,,}/backend" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_lowercase.outputs.value }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Build and push Docker image by digest
        id: build-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags:
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.repo_lowercase.outputs.value }},push-by-digest=true,name-canonical=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # The image scan is a hard gate: exit-code 1 for fixed HIGH/CRITICAL findings.
      # If current base images contain such CVEs, the first push fails and publishes no tags.
      # Remediate via a C04 base-image bump or a reviewed, expiring .trivyignore;
      # do not restore continue-on-error. Trivy selects manifests via TRIVY_PLATFORM.
      - name: Scan linux/amd64 image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ steps.repo_lowercase.outputs.value }}@${{ steps.build-push.outputs.digest }}'
          format: 'sarif'
          output: 'trivy-backend-amd64-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Scan linux/arm64 image with Trivy
        if: always() && github.event_name != 'pull_request' && steps.build-push.outcome == 'success'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ steps.repo_lowercase.outputs.value }}@${{ steps.build-push.outputs.digest }}'
          format: 'sarif'
          output: 'trivy-backend-arm64-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Upload Trivy SARIF as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-backend-sarif
          path: trivy-backend-*-results.sarif
          if-no-files-found: warn
          retention-days: 30
        if: always() && github.event_name != 'pull_request' && steps.build-push.outcome == 'success'

      - name: Upload amd64 Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: 'trivy-backend-amd64-results.sarif'
          category: 'backend-image-linux-amd64'
        continue-on-error: true
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-backend-amd64-results.sarif') != ''

      - name: Upload arm64 Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: 'trivy-backend-arm64-results.sarif'
          category: 'backend-image-linux-arm64'
        continue-on-error: true
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-backend-arm64-results.sarif') != ''

      - name: Publish tags for scanned digest
        if: github.event_name != 'pull_request' && success()
        env:
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.repo_lowercase.outputs.value }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Generate SBOM summary
        run: |
          echo "### Backend Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ steps.repo_lowercase.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        if: github.event_name != 'pull_request'
