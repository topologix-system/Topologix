services:
  # Batfish Network Analysis Service
  # Pinned digest validated with pybatfish 2025.7.7.2423; override via BATFISH_IMAGE.
  batfish:
    image: ${BATFISH_IMAGE:-batfish/allinone@sha256:09817554db90e2f2674b72562c2d659427094187de0a3dfc23534ab58bf26207}
    container_name: batfish
    ports:
      - "8888:8888"
      - "9996:9996"
      - "9997:9997"
    volumes:
      - batfish-data:/data
      - snapshots-data:/notebooks/snapshots

    networks:
      - topologix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/9996' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Backend API Service (Python + Flask)
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/topologix-system/topologix/backend:latest}
    container_name: topologix-backend
    # Command: default to single-worker gunicorn for process-local Batfish session state.
    # Production (default): gunicorn --worker-class gevent --workers 1 --bind 0.0.0.0:5000 app:app
    # Development: BACKEND_COMMAND="python app.py"
    command:
      - /bin/sh
      - -c
      - ${BACKEND_COMMAND:-gunicorn --worker-class gevent --workers 1 --bind 0.0.0.0:5000 app:app}
    ports:
      - "5000:5000"
    environment:
      # Flask Environment (development or production)
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}

      # Batfish Service
      - BATFISH_HOST=${BATFISH_HOST:-batfish}
      - BATFISH_PORT=${BATFISH_PORT:-9996}
      # Explicitly pass the per-query timeout into the backend container.
      - BATFISH_QUERY_TIMEOUT_SECONDS=${BATFISH_QUERY_TIMEOUT_SECONDS:-120}

      # CORS origins for API access
      # Include localhost and common LAN access patterns
      # For production, override with your specific domain/IP
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      # Authentication (disabled by default for OSS distribution)
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_DEFAULT_ADMIN_USER=${AUTH_DEFAULT_ADMIN_USER:-admin}
      - AUTH_DEFAULT_ADMIN_PASS=${AUTH_DEFAULT_ADMIN_PASS}
      # Allow user self-registration (set to 'false' for admin-only registration)
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}

      # CSRF protection mode (session or double-submit)
      - CSRF_MODE=${CSRF_MODE:-session}

      # Security Keys (auto-generated if not set, but should be set in production)
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY}

      # JWT Access Token Expiration (1 hour default, OWASP ASVS L2 compliant)
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES:-3600}

      # Login security (OSS defaults - secure but not too restrictive)
      - LOGIN_MAX_ATTEMPTS_PER_IP=${LOGIN_MAX_ATTEMPTS_PER_IP:-10}
      - LOGIN_RATE_WINDOW_MINUTES=${LOGIN_RATE_WINDOW_MINUTES:-15}
      # Account lockout configuration (OWASP recommendation: 5-10 attempts)
      - ACCOUNT_LOCKOUT_THRESHOLD=${ACCOUNT_LOCKOUT_THRESHOLD:-5}
      - LOGIN_LOCKOUT_DURATION_MINUTES=${LOGIN_LOCKOUT_DURATION_MINUTES:-30}

      # Database configuration (snapshot version history in both auth modes,
      # authentication data when AUTH_ENABLED=true)
      # SQLite (default - stored in Docker volume for persistence)
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/topologix.db}
      # SQL statement logging is disabled by default because SQL values can contain sensitive hashes.
      - SQLALCHEMY_ECHO=${SQLALCHEMY_ECHO:-false}

      # Snapshot storage path (must match the snapshots-data mount below)
      - SNAPSHOTS_DIR=${SNAPSHOTS_DIR:-/app/snapshots}

      # Snapshot history and result cache (see README "Snapshot History and Result Cache"
      # and .env.example). An empty value is treated as unset and selects the backend default.
      # DATA_DIR defaults to /app/data (the backend-db volume below); RESULT_CACHE_DIR and
      # SNAPSHOT_HISTORY_DIR default to result_cache/ and snapshot_history/ inside DATA_DIR.
      # SNAPSHOTS_DIR, RESULT_CACHE_DIR, SNAPSHOT_HISTORY_DIR and DATA_DIR/_invalid-namespace
      # must not equal or contain one another and DATA_DIR must not equal or lie inside
      # SNAPSHOTS_DIR; otherwise versioning is unavailable and the result cache is off.
      - DATA_DIR=${DATA_DIR:-}
      - RESULT_CACHE_DIR=${RESULT_CACHE_DIR:-}
      - SNAPSHOT_HISTORY_DIR=${SNAPSHOT_HISTORY_DIR:-}
      # RESULT_CACHE_ENABLED=false turns the result cache off (kill switch)
      - RESULT_CACHE_ENABLED=${RESULT_CACHE_ENABLED:-}
      - RESULT_CACHE_MAX_BYTES=${RESULT_CACHE_MAX_BYTES:-}
      - RESULT_CACHE_MAX_ENTRIES=${RESULT_CACHE_MAX_ENTRIES:-}
      - RESULT_CACHE_PROTECT_SECONDS=${RESULT_CACHE_PROTECT_SECONDS:-}
      - HISTORY_GC_GRACE_SECONDS=${HISTORY_GC_GRACE_SECONDS:-}
      # Set only to the db_id named by the startup ERROR about a missing object store;
      # remove it once the startup WARNING reports no marked snapshot
      - HISTORY_ACCEPT_STORE_LOSS=${HISTORY_ACCEPT_STORE_LOSS:-}
      - EXTERNAL_CHANGE_SETTLE_SECONDS=${EXTERNAL_CHANGE_SETTLE_SECONDS:-}
      - BATFISH_VERSION_PROBE_TTL_SECONDS=${BATFISH_VERSION_PROBE_TTL_SECONDS:-}
      - BATFISH_VERSION_GRACE_SECONDS=${BATFISH_VERSION_GRACE_SECONDS:-}
      - SNAPSHOT_DIFF_MAX_BYTES=${SNAPSHOT_DIFF_MAX_BYTES:-}
      - SNAPSHOT_DIFF_MAX_LINES=${SNAPSHOT_DIFF_MAX_LINES:-}
      # History namespace of this stack in the database (empty: the UUID stored in
      # SNAPSHOTS_DIR/.topologix-store.json). An existing deployment that adopts it sets it to
      # that UUID. docker-compose.dev.yaml reads DEV_DEPLOYMENT_ID instead, so a value in the
      # shared .env applies to this stack only.
      - DEPLOYMENT_ID=${DEPLOYMENT_ID:-}
      # Backend build id of cached results; normally empty (derived from the backend sources).
      # A set value must be unique per backend build. The dev stack reads DEV_APP_BUILD_ID.
      - APP_BUILD_ID=${APP_BUILD_ID:-}

      # Email configuration for password reset
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@topologix.local}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Topologix}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}

      # Password Reset
      - PASSWORD_RESET_TOKEN_EXPIRY=${PASSWORD_RESET_TOKEN_EXPIRY:-3600}
      - PASSWORD_RESET_URL_BASE=${PASSWORD_RESET_URL_BASE:-http://localhost:3000}

      # Reverse proxy configuration (see .env.example for details)
      # Set to 'true' when behind reverse proxy (nginx, Caddy, etc.)
      # CRITICAL: Must match actual infrastructure to prevent IP spoofing
      - BEHIND_REVERSE_PROXY=${BEHIND_REVERSE_PROXY:-false}
      # Number of trusted proxies in chain:
      # - 1 for single nginx (typical Docker setup)
      # - 2 for Caddy/nginx -> nginx -> Flask
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-1}
      # PostgreSQL example (recommended for production):
      # - DATABASE_URL=postgresql://user:password@postgres:5432/topologix
      # MySQL example:
      # - DATABASE_URL=mysql+pymysql://user:password@mysql:3306/topologix
    volumes:
      # Snapshots directory (shared with Batfish)
      - snapshots-data:/app/snapshots
      # Data volume (DATA_DIR): SQLite database, snapshot history objects and result cache
      # in both auth modes
      - backend-db:/app/data
      # Flask session storage (named volume for proper permissions)
      - flask-sessions:/app/flask_session
    networks:
      - topologix-network
    depends_on:
      batfish:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web UI (React + Vite)
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/topologix-system/topologix/frontend:latest}
    container_name: topologix-frontend
    ports:
      - "3000:80"
    # Runtime environment variables consumed by docker-entrypoint.sh
    # to generate /usr/share/nginx/html/runtime-config.js.
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      # Authentication (must match backend AUTH_ENABLED)
      - VITE_AUTH_ENABLED=${VITE_AUTH_ENABLED:-false}
      # Timezone for frontend timestamp display
      - VITE_TIMEZONE=${VITE_TIMEZONE:-Asia/Tokyo}
    networks:
      - topologix-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  topologix-network:
    driver: bridge
    name: topologix-network

volumes:
  # Batfish data persistence
  batfish-data:
    name: topologix-batfish-data

  # Shared snapshot storage between backend and Batfish
  snapshots-data:
    name: topologix-snapshots

  # Backend data (DATA_DIR): SQLite database, snapshot history and result cache in both auth modes
  backend-db:
    name: topologix-backend-db

  # Flask session storage (isolated from host for proper permissions)
  flask-sessions:
    name: topologix-flask-sessions
